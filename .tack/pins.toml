[inputs.home-manager]
url = "github:nix-community/home-manager/master"
follows = { nixpkgs = "nixpkgs" }

[inputs.import-tree]
url = "github:denful/import-tree/main"

[inputs.make-shell]
url = "github:nicknovitski/make-shell/main"

[inputs.massgrave]
url = "github:massgravel/microsoft-activation-scripts/master"
