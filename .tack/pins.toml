[inputs.microvm-nix]
url = "github:microvm-nix/microvm.nix/main"
follows = { nixpkgs = "nixpkgs", spectrum = "spectrum" }

[inputs.nix-darwin]
url = "github:nix-darwin/nix-darwin/master"
follows = { nixpkgs = "nixpkgs" }

[inputs.nix-math]
url = "github:xddxdd/nix-math/master"
