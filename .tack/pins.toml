# tack pins. generated by flake-file write-tack.
# nix reads pins.lock.json; this file drives tack update

[tack]
recomposable = true

[all_follow]
nixpkgs = ["nixpkgs-lib"]

[inputs.betterfox]
url = "github:yokoffing/betterfox/main"
type = "fetch"

[inputs.dag]
url = "github:denful/dag"

[inputs.den]
url = "github:denful/den/main"

[inputs.disko]
url = "github:nix-community/disko/master"
follows = { nixpkgs = "nixpkgs" }

[inputs.dns-malw-link]
url = "github:immalware/dns.malw.link/master"
type = "fetch"

[inputs.erosanix]
url = "github:emmanuelrosa/erosanix/master"
follows = { nixpkgs = "nixpkgs" }

[inputs.files]
url = "github:sini/files"

[inputs.finix]
url = "github:finix-community/finix/main"

[inputs.finix-community]
url = "github:finix-community/community-modules/main"

[inputs.flake-file]
url = "github:unazikx/flake-file/main"

[inputs.flake-parts]
url = "github:hercules-ci/flake-parts/main"
follows = { nixpkgs-lib = "nixpkgs" }

[inputs.flake-utils]
url = "github:numtide/flake-utils/main"

[inputs.gnome-shell]
url = "github:gnome/gnome-shell/main"
