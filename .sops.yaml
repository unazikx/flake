# > ssh-to-age < ~/.ssh/id_ed25519.pub
# or
# > nix run nixpkgs#ssh-to-age -- < ~/.ssh/id_ed25519.pub
keys:
  - &pcRyazenka age16dzy76gf6jcw03cppgghm7a8ld4g57f73z85wcj9fvq7w3ct53rs4rclm7
  - &thinkpadT14 age16ermygpuxg2k6mmyu3q9nzjptzjdqz6kyswnhpxktqa58stff5cs3aupl6
# to rekey secrets
# > sops updatekeys ./file

creation_rules:
  - path_regex: secrets/thinkpadT14/sops.nix
    key_groups:
      - age:
          - *thinkpadT14

  - path_regex: secrets/pcRyazenka/sops.nix
    key_groups:
      - age:
          - *pcRyazenka

  # allows to create .<name>.ext
  - path_regex: secrets/sops.yaml
    key_groups:
      - age:
          - *pcRyazenka
          - *thinkpadT14
